# Pipeline CI/CD para microservicio Spring Boot
#  - PR a main      -> build, tests, análisis, escaneo, build de imagen (sin push)
#  - push a main    -> todo lo anterior + push a GHCR + deploy a STAGING
#  - tag vX.Y.Z     -> todo lo anterior + push a GHCR + deploy a PRODUCCIÓN (con aprobación)
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- CI
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para Sonar (blame / new code)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Unit tests (surefire) + integración (failsafe/Testcontainers) + JaCoCo
      - name: Build y tests
        run: ./mvnw -B -ntp verify

      - name: Publicar resultados de tests
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados JUnit
          path: 'target/surefire-reports/*.xml,target/failsafe-reports/*.xml'
          reporter: java-junit
          fail-on-empty: false

      - name: Cobertura en el PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 80

      - name: Análisis SonarCloud
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # "Build once": el mismo JAR probado es el que va en la imagen
      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  dependency-scan:
    name: Escaneo de dependencias y secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
      - name: Publicar en GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------- Imagen
  docker:
    name: Imagen Docker
    needs: [build-test, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # firma keyless con cosign
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - uses: docker/setup-buildx-action@v3

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build local para escaneo
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Firmar imagen
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # ---------------------------------------------------------------- CD
  deploy-staging:
    name: Deploy a staging
    needs: docker
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}
    secrets: inherit

  deploy-production:
    name: Deploy a producción
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}
    secrets: inherit
